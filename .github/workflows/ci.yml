name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# One run per ref: a new push to the same branch cancels the superseded
# run instead of letting duplicate full-matrix builds queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Audit frontend deps
        run: npm audit --audit-level=moderate || true

      - name: Build frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  backend:
    name: Backend (Node.js web server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend deps
        working-directory: web
        run: npm ci

      - name: Syntax check server modules
        run: node --check web/server.mjs && node --check web/config.mjs && node --check web/eventBus.mjs && node --check web/validate.mjs

      - name: Syntax check routes
        run: node --check web/routes/probe.mjs && node --check web/routes/download.mjs && node --check web/routes/history.mjs && node --check web/routes/status.mjs && node --check web/routes/restart.mjs

      - name: Syntax check services
        run: node --check web/services/engineManager.mjs && node --check web/services/historyService.mjs

      - name: Syntax check middleware
        run: node --check web/middleware/static.mjs && node --check web/middleware/security.mjs && node --check web/middleware/requestLog.mjs

      - name: Audit backend deps
        run: npm audit --audit-level=moderate || true
        working-directory: web

      - name: Run backend unit tests
        working-directory: web
        # Globbing so newly added test files are picked up automatically —
        # the previous hardcoded 11-file list silently skipped additions.
        run: node --test tests/*.test.mjs

  python:
    name: Python Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          pip install -r python-engine/requirements.lock

      - name: Install test runner
        run: |
          pip install -r python-engine/requirements-dev.txt pip-audit

      - name: Audit Python deps
        run: pip-audit -r python-engine/requirements.lock || true

      - name: Syntax check Python files
        run: |
          python -m py_compile python-engine/engine.py
          python -m py_compile python-engine/ipc_main.py
          python -m py_compile python-engine/helpers.py
          python -m py_compile python-engine/logger.py

      - name: Import check
        run: |
          python -c "import sys; sys.path.insert(0, 'python-engine'); import engine; import helpers; import logger; print('Python imports OK')"

      - name: Run Python unit tests
        run: |
          cd python-engine
          python -m pytest tests -v

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      # Runners have no `python` binary — without this the engine can never
      # spawn and the engineReady assertion would pass vacuously.
      PYTHON: python3
    steps:
      # Isolated data dir so the smoke test's history-clear (DELETE) never
      # touches real user data. Set via a run step (writes $GITHUB_ENV): the
      # `runner` context cannot be used at job-level `env:` — expressions
      # there are resolved server-side — and `${{ runner.temp }}` in that
      # block made the WHOLE workflow file invalid (every run failed
      # instantly with zero jobs: "Unrecognized named-value: 'runner'").
      - name: Set scratch data dir
        run: echo "YTDL_DATA_DIR=${{ runner.temp }}/ytdl-smoke-data" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend deps
        working-directory: web
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: dist/

      - name: Start server
        run: |
          cd web
          node server.mjs &
          # Wait for the server to become healthy (retry loop instead of a fixed sleep).
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to become healthy within 30s" >&2
          exit 1

      - name: Run smoke tests
        run: node test-smoke.mjs
